name: Web CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      RUNEFORGE_PORTAL_DEPLOY_SHA: ${{ github.sha }}
      RUNEFORGE_PORTAL_DEPLOY_ENV: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - run: npm run ci:install
      - run: npm run contract:test
      - name: Certify Vercel system identity fallback
        env:
          RUNEFORGE_PORTAL_DEPLOY_SHA: ""
          RUNEFORGE_PORTAL_DEPLOY_ENV: ""
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VERCEL_ENV: preview
        run: npm run release:preflight
      - run: npm run typecheck
      - run: npm run production:build
      - run: npx playwright install --with-deps chromium
      - run: |
          npm start &
          npx wait-on http://127.0.0.1:3000
          npm run visual:test
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rune-forge-visual-evidence
          path: visual-evidence/
          if-no-files-found: warn
