name: Bootstrap Standalone Card Snapshot

on:
  push:
    branches:
      - feat/standalone-card-catalog
    paths:
      - .github/workflows/standalone-card-snapshot-bootstrap.yml
      - scripts/export-standalone-card-snapshot.mjs

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: runeforge_snapshot
          POSTGRES_USER: runeforge
          POSTGRES_PASSWORD: runeforge_snapshot_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runeforge -d runeforge_snapshot"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      RUNEFORGE_BACKEND_REF: 4028da3999c168fa43e55c967d2d9cf90d30ebb1
      RUNEFORGE_DEPLOY_SHA: 4028da3999c168fa43e55c967d2d9cf90d30ebb1
      RUNEFORGE_DEPLOY_ENV: alpha
      DATABASE_URL: postgresql://runeforge:runeforge_snapshot_only@localhost:5432/runeforge_snapshot
      RANKED_RELEASE_CERTIFIED: "false"

    steps:
      - name: Checkout portal branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: portal
          persist-credentials: true

      - name: Checkout certified RuneForgedTCG
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EntropiaEKaos/RuneForgedTCG
          ref: ${{ env.RUNEFORGE_BACKEND_REF }}
          path: backend
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      - name: Install backend
        working-directory: backend
        run: npm run ci:install

      - name: Bootstrap database
        working-directory: backend
        run: npm run db:bootstrap

      - name: Build backend
        working-directory: backend
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
        run: npm run build

      - name: Export certified public cards
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          npm start -- -p 3001 > /tmp/runeforge-snapshot-backend.log 2>&1 &
          BACKEND_PID=$!
          trap 'kill "$BACKEND_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then break; fi
            if [ "$i" = "60" ]; then cat /tmp/runeforge-snapshot-backend.log; exit 1; fi
            sleep 1
          done

          cd ../portal
          RUNEFORGE_SNAPSHOT_EXPECTED_SHA="$RUNEFORGE_BACKEND_REF" \
          RUNEFORGE_SNAPSHOT_BACKEND_DIR=../backend \
          node scripts/export-standalone-card-snapshot.mjs

      - name: Commit snapshot
        working-directory: portal
        shell: bash
        run: |
          set -euo pipefail
          git add src/data/card-catalog-snapshot.json public/standalone-game
          if git diff --cached --quiet; then
            echo "Snapshot already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(cards): bootstrap certified standalone catalog snapshot"
          git push origin HEAD:feat/standalone-card-catalog
