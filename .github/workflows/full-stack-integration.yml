name: Full Stack Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: full-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: runeforge_integration
          POSTGRES_USER: runeforge
          POSTGRES_PASSWORD: runeforge_integration_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runeforge -d runeforge_integration"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      RUNEFORGE_BACKEND_REF: 6656a81010785536afd73e5fc84513737041316c
      DATABASE_URL: postgresql://runeforge:runeforge_integration_only@localhost:5432/runeforge_integration
      RANKED_RELEASE_CERTIFIED: "false"

    steps:
      - name: Checkout portal
        uses: actions/checkout@v4
        with:
          path: portal
          persist-credentials: false

      - name: Checkout certified RuneForgedTCG backend
        uses: actions/checkout@v4
        with:
          repository: EntropiaEKaos/RuneForgedTCG
          ref: ${{ env.RUNEFORGE_BACKEND_REF }}
          path: backend
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Install backend
        working-directory: backend
        run: npm run ci:install

      - name: Bootstrap integration database
        working-directory: backend
        run: npm run db:bootstrap

      - name: Build backend
        working-directory: backend
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
        run: npm run build

      - name: Install portal
        working-directory: portal
        run: npm install

      - name: Install Chromium
        working-directory: portal
        run: npx playwright install --with-deps chromium

      - name: Run cross-repository browser certification
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          npm start -- -p 3001 > /tmp/runeforge-backend.log 2>&1 &
          BACKEND_PID=$!
          cd ../portal

          cleanup() {
            status=$?
            if [ -n "${SITE_PID:-}" ]; then kill "$SITE_PID" 2>/dev/null || true; fi
            if [ -n "${BACKEND_PID:-}" ]; then kill "$BACKEND_PID" 2>/dev/null || true; fi
            if [ "$status" -ne 0 ]; then
              echo "--- RuneForgedTCG backend log ---"
              cat /tmp/runeforge-backend.log || true
              echo "--- SiteRuneForged portal log ---"
              cat /tmp/runeforge-portal.log || true
            fi
            exit "$status"
          }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then break; fi
            if [ "$i" = "60" ]; then cat /tmp/runeforge-backend.log; exit 1; fi
            sleep 1
          done

          export RUNEFORGE_API_URL=http://127.0.0.1:3001
          export RUNEFORGE_ADMIN_API_URL=http://127.0.0.1:3001
          npm run build
          npm start -- -p 3000 > /tmp/runeforge-portal.log 2>&1 &
          SITE_PID=$!

          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000 >/dev/null; then break; fi
            if [ "$i" = "60" ]; then cat /tmp/runeforge-portal.log; exit 1; fi
            sleep 1
          done

          RUNEFORGE_INTEGRATION_BACKEND_URL=http://127.0.0.1:3001 \
          RUNEFORGE_INTEGRATION_SITE_URL=http://127.0.0.1:3000 \
          node scripts/full-stack-integration.mjs

      - name: Upload full-stack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rune-forge-full-stack-${{ github.sha }}
          path: portal/integration-evidence/
          if-no-files-found: warn
