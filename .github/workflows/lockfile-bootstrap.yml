name: Lockfile Bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - package.json
      - .github/workflows/lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Generate exact npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate generated lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit validated lockfile to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches package.json"
            exit 0
          fi
          git commit -m "build: lock portal dependencies"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: portal-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
